<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">dof-diario</title>
  <desc id="desc">A living open dataset of the Diario Oficial de la Federación table of contents, updated daily by GitHub Actions. The chart shows titled notes per month from ene 2025 to nov 2026. As of 2026-11-17 the dataset holds 43,994 notes from 484 days with an edition.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#191d27" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#cfff45" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#cfff45" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .serif { font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-style: italic; }
      .sans { font-family: Inter, ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 0.7s cubic-bezier(.2,.8,.2,1) both; }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes pulse { 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { .bar, .dot { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#0a0c10"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.7"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <g>
    <circle class="dot" cx="69" cy="75" r="5" fill="#cfff45"/>
    <text x="86" y="80" class="mono" font-size="13" letter-spacing="3" fill="#969dab">OPEN DATASET · GITHUB ACTIONS · DAILY</text>
    <text x="60" y="170" class="mono" font-size="76" font-weight="700" fill="#eceee6" letter-spacing="-1">dof<tspan fill="#cfff45">-diario</tspan></text>
    <text x="64" y="228" class="serif" font-size="32" fill="#eceee6">el sumario del Diario Oficial,</text>
    <text x="64" y="264" class="serif" font-size="32" fill="#eceee6">archivado cada día.</text>
    <text x="64" y="318" class="sans" font-size="15" fill="#969dab">Every DOF note since January 2025 · JSON + JSON Schema · static search site</text>
    <text x="64" y="344" class="mono" font-size="13" fill="#ffb648">beg-lag.github.io/dof-diario</text>
  </g>

  <g>
    <text x="660" y="74" class="mono" font-size="12" fill="#969dab">notas por mes · ene 2025 a nov 2026</text>
    <line x1="660" x2="1136" y1="292.5" y2="292.5" stroke="#232838"/>
    <rect class="bar" style="animation-delay:0.15s" x="663.9" y="175.1" width="12.8" height="116.9" rx="2" fill="#cfff45"><title>ene 2025: 429 notas</title></rect>
    <rect class="bar" style="animation-delay:0.19s" x="684.6" y="183.8" width="12.8" height="108.2" rx="2" fill="#cfff45"><title>feb 2025: 397 notas</title></rect>
    <rect class="bar" style="animation-delay:0.23s" x="705.3" y="185.4" width="12.8" height="106.6" rx="2" fill="#cfff45"><title>mar 2025: 391 notas</title></rect>
    <rect class="bar" style="animation-delay:0.27s" x="726.0" y="179.1" width="12.8" height="112.9" rx="2" fill="#cfff45"><title>abr 2025: 414 notas</title></rect>
    <rect class="bar" style="animation-delay:0.31s" x="746.7" y="167.7" width="12.8" height="124.3" rx="2" fill="#cfff45"><title>may 2025: 456 notas</title></rect>
    <rect class="bar" style="animation-delay:0.35s" x="767.4" y="156.0" width="12.8" height="136.0" rx="2" fill="#cfff45"><title>jun 2025: 499 notas</title></rect>
    <rect class="bar" style="animation-delay:0.39s" x="788.1" y="128.4" width="12.8" height="163.6" rx="2" fill="#cfff45"><title>jul 2025: 600 notas</title></rect>
    <rect class="bar" style="animation-delay:0.43s" x="808.8" y="149.2" width="12.8" height="142.8" rx="2" fill="#cfff45"><title>ago 2025: 524 notas</title></rect>
    <rect class="bar" style="animation-delay:0.47s" x="829.5" y="161.7" width="12.8" height="130.3" rx="2" fill="#cfff45"><title>sep 2025: 478 notas</title></rect>
    <rect class="bar" style="animation-delay:0.51s" x="850.2" y="138.0" width="12.8" height="154.0" rx="2" fill="#cfff45"><title>oct 2025: 565 notas</title></rect>
    <rect class="bar" style="animation-delay:0.55s" x="870.9" y="158.7" width="12.8" height="133.3" rx="2" fill="#cfff45"><title>nov 2025: 489 notas</title></rect>
    <rect class="bar" style="animation-delay:0.59s" x="891.6" y="96.0" width="12.8" height="196.0" rx="2" fill="#cfff45"><title>dic 2025: 719 notas</title></rect>
    <rect class="bar" style="animation-delay:0.63s" x="912.3" y="186.8" width="12.8" height="105.2" rx="2" fill="#cfff45"><title>ene 2026: 386 notas</title></rect>
    <rect class="bar" style="animation-delay:0.67s" x="933.0" y="190.6" width="12.8" height="101.4" rx="2" fill="#cfff45"><title>feb 2026: 372 notas</title></rect>
    <rect class="bar" style="animation-delay:0.71s" x="953.7" y="165.5" width="12.8" height="126.5" rx="2" fill="#cfff45"><title>mar 2026: 464 notas</title></rect>
    <rect class="bar" style="animation-delay:0.75s" x="974.4" y="162.5" width="12.8" height="129.5" rx="2" fill="#cfff45"><title>abr 2026: 475 notas</title></rect>
    <rect class="bar" style="animation-delay:0.79s" x="995.1" y="148.1" width="12.8" height="143.9" rx="2" fill="#cfff45"><title>may 2026: 528 notas</title></rect>
    <rect class="bar" style="animation-delay:0.83s" x="1015.8" y="142.6" width="12.8" height="149.4" rx="2" fill="#cfff45"><title>jun 2026: 548 notas</title></rect>
    <rect class="bar" style="animation-delay:0.87s" x="1036.5" y="141.5" width="12.8" height="150.5" rx="2" fill="#cfff45"><title>jul 2026: 552 notas</title></rect>
    <rect class="bar" style="animation-delay:0.91s" x="1057.1" y="166.6" width="12.8" height="125.4" rx="2" fill="#cfff45"><title>ago 2026: 460 notas</title></rect>
    <rect class="bar" style="animation-delay:0.95s" x="1077.8" y="185.7" width="12.8" height="106.3" rx="2" fill="#cfff45"><title>sep 2026: 390 notas</title></rect>
    <rect class="bar" style="animation-delay:0.99s" x="1098.5" y="184.3" width="12.8" height="107.7" rx="2" fill="#cfff45"><title>oct 2026: 395 notas</title></rect>
    <rect class="bar" style="animation-delay:1.03s" x="1119.2" y="248.9" width="12.8" height="43.1" rx="2" fill="#cfff45" opacity="0.45"><title>nov 2026: 158 notas</title></rect>
    <text x="660" y="318" class="mono" font-size="12" fill="#eceee6">43,994 <tspan fill="#969dab">notes</tspan>  484 <tspan fill="#969dab">days</tspan></text>
  </g>

  <text x="1140" y="376" text-anchor="end" class="mono" font-size="11" fill="#969dab" opacity="0.8">data as of 2026-11-17 · unofficial, not legal advice</text>
</svg>
