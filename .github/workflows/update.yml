name: Update dataset

# Mexico City has used UTC-6 all year since 2022 (no daylight saving time).
#   14:15 UTC = 08:15 in Mexico City, after the matutina (morning) edition.
#   04:15 UTC = 22:15 in Mexico City, after most vespertina (evening) editions.
# Each run re-fetches the last 4 days, so late editions and corrections are picked up.
on:
  schedule:
    - cron: "15 14 * * *"
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to re-fetch (including today)"
        default: "4"
        required: false

permissions:
  contents: write

concurrency:
  group: update-dataset
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Fetch new editions from SIDOF
        run: uv run --frozen dof-diario update --days "${{ inputs.days || '4' }}"

      - name: Validate the dataset
        run: uv run --frozen pytest -q tests/test_dataset.py tests/test_site_files.py

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No changes in the DOF index."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(jq -r .last_publication data/meta.json)
          notes=$(jq -r .notes data/meta.json)
          git commit -m "chore(data): update DOF index through ${last} (${notes} notes)"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
